[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wsi-patch-extractor"
version = "0.1.0"
description = "Efficient patch extraction from whole-slide images with tissue masking"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Abhishek Thakur", email = "a.thakur5690@gmail.com"}]
requires-python = ">=3.9"
keywords = ["digital-pathology", "whole-slide-image", "patch-extraction", "computational-pathology"]
dependencies = [
    "openslide-python>=1.3.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
    "tqdm>=4.65.0",
]

[project.scripts]
wsi-extract = "wsi_patch_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
